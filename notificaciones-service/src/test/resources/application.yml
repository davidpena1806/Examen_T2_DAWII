spring:
  application:
    name: notificaciones-service
  r2dbc:
    url: r2dbc:h2:mem:///notifdb;DB_CLOSE_DELAY=-1
  sql:
    init:
      mode: always
  rabbitmq:
    listener:
      simple:
        auto-startup: false     # las pruebas no requieren un broker real
  cloud:
    discovery:
      enabled: false
eureka:
  client:
    enabled: false
